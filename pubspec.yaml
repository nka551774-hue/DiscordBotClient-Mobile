name: discord_bot_client
description: Ultra-lightweight, 120fps low-power mobile Discord Bot Client for Android (APK) & iOS (IPA), inspired by aiko-chan-ai/DiscordBotClient.
publish_to: 'none'
version: 1.7.1+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
