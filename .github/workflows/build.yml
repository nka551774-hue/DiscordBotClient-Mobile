name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. Build Android Release APK (ARM64 + Universal)
  # ==========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Permissions
        run: |
          flutter create --platforms=android --org io.botclient.mobile --project-name discord_bot_client .
          rm -rf test
          python3 - << 'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          text = text.replace('android:label="discord_bot_client"', 'android:label="DiscordBotClient"')
          manifest.write_text(text, encoding="utf-8")
          EOF

      - name: Install Dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Android Split-ABI APK (Ultra-light ARM64)
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/DiscordBotClient-arm64-v8a.apk

      - name: Build Android Universal APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/DiscordBotClient-universal.apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-Android-APK
          path: dist/*.apk

  # ==========================================================
  # 2. Build iOS Release IPA (120Hz ProMotion, Sideload Ready)
  # ==========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Scaffolding & Configure 120Hz ProMotion + Permissions
        run: |
          flutter create --platforms=ios --org io.botclient.mobile --project-name discord_bot_client .
          rm -rf test
          flutter pub get
          python3 - << 'EOF'
          import plistlib
          from pathlib import Path

          plist_path = Path("ios/Runner/Info.plist")
          with plist_path.open("rb") as f:
              pl = plistlib.load(f)

          pl["CFBundleDisplayName"] = "DiscordBotClient"
          pl["CFBundleName"] = "DiscordBotClient"
          pl["CADisableMinimumFrameDurationOnPhone"] = True
          pl["NSPhotoLibraryUsageDescription"] = "允許選擇相簿圖片作為機器人訊息附件上傳至 Discord 頻道。"
          pl["NSCameraUsageDescription"] = "允許拍攝照片作為機器人訊息附件上傳。"

          with plist_path.open("wb") as f:
              plistlib.dump(pl, f)
          EOF

      - name: Build Unsigned iOS Release App via Xcode
        run: |
          flutter build ios --config-only --release --no-codesign
          if [ -d "ios/Runner.xcworkspace" ]; then
            XCODE_TARGET=(-workspace ios/Runner.xcworkspace)
          else
            XCODE_TARGET=(-project ios/Runner.xcodeproj)
          fi
          xcodebuild build \
            "${XCODE_TARGET[@]}" \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package & Ad-Hoc Sign Sideloadable IPA
        run: |
          mkdir -p dist
          APP_PATH="build/ios_derived/Build/Products/Release-iphoneos/Runner.app"
          ls -la "$APP_PATH"
          rm -rf build/ipa_stage
          mkdir -p build/ipa_stage/Payload
          cp -R "$APP_PATH" build/ipa_stage/Payload/Runner.app
          codesign --force --deep --sign - build/ipa_stage/Payload/Runner.app || true
          cd build/ipa_stage
          zip -qry ../../dist/DiscordBotClient-ios.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-iOS-IPA
          path: dist/DiscordBotClient-ios.ipa

  # ==========================================================
  # 3. Publish Combined GitHub Release (APK + IPA)
  # ==========================================================
  publish-release:
    name: Publish APK & IPA Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiscordBotClient-Android-APK
          path: release-assets

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: DiscordBotClient-iOS-IPA
          path: release-assets

      - name: Create / Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          make_latest: true
          name: "DiscordBotClient Mobile v1.8.0 (Android APK & iOS IPA)"
          body: |
            ## DiscordBotClient Mobile v1.8.0
            參考 `aiko-chan-ai/DiscordBotClient`、`aiko-chan-ai/VencordDBCPlugin` 與 `Vendicated/Vencord` 打造的原生級、超低耗能、120Hz 流暢手機版 Discord 機器人客戶端。

            ### v1.8.0 更新內容 (依官方截圖重做語音房與頻道詳情)
            - **語音大廳**：與官方相同的頂部 ⌄ / 邀請圓鈕、重疊頭像群組、頻道名稱與「A、B 和其他 N 人」、直播卡片、成員列表，以及底部浮動列（麥克風、綠色「加入語音」、文字聊天）。
            - **通話中畫面**：官方漸層舞台、頂部「頻道名稱 >」膠囊（點擊開啟通話詳情：延遲、音效板、邀請、中斷連線）、喇叭與邀請按鈕、置中參與者方塊（說話綠框、靜音圖示），底部浮動控制列（麥克風 / 拒聽 / 聊天 / 活動與音效板 / 紅色掛斷）。
            - **頻道詳情頁**：如官方點擊頻道名稱開啟底部詳情頁（頻道圖示、名稱、主題、搜尋 / 討論串 / 邀請 / 設定圓鈕），下方「成員 / 媒體 / 釘選 / 連結 / 檔案」分頁；移除官方已不存在的左滑成員抽屜。

            - **成員管理（禁言 / 踢出 / 停權）**：在成員列表長按成員，或在個人資料「⋯」選單，可禁言（60 秒至 1 週，或解除禁言）、踢出、停權，並可填寫審核日誌原因；改用伺服器層級權限與身分組階層判斷（階層不足會顯示原因），修正原本依目前頻道權限而誤隱藏的問題。

            ### v1.7.2 更新內容 (成員線上狀態)
            - **成員列表線上 / 離線分組**：追蹤 Gateway `GUILD_CREATE` presences 與 `PRESENCE_UPDATE`，依官方規則將線上成員依置頂身分組分組、其餘歸入「線上」，離線成員集中於「離線」並淡化顯示；每位成員顯示狀態點與自訂狀態 / 正在玩等活動文字（需於「設定」開啟 Presence Intent，並於 Developer Portal 啟用 PRESENCE INTENT）。

            ### v1.7.1 更新內容 (聊天標題列與成員列表)
            - **聊天標題列**：頻道圖示改用與頻道列表相同的 `#` / 公告 / 討論串圖示，名稱後加上官方「>」提示點擊可開啟頻道詳情，成員按鈕改為官方雙人圖示。
            - **成員列表**：改為官方單行成員列（32px 頭像、身分組顏色名稱、APP 標籤，不再顯示使用者名稱副標），機器人本身顯示即時狀態；搜尋框輸入時即時篩選，按下送出再向伺服器搜尋。

            ### v1.7.0 更新內容 (對齊官方 Discord 手機版介面與互動)
            - **官方底部導覽列**：以「首頁 / 通知 / 你」三分頁取代懸浮 You Bar；通知改為完整分頁並顯示相對時間，「你」分頁直接嵌入個人資料頁，長按「你」可切換帳號，返回鍵會先回到「首頁」。
            - **訊息長按選單**：改為官方分組卡片排序（編輯 / 回覆 → 複製文字 / 釘選 / 複製訊息連結 → 插件功能 → 複製 ID / 刪除），新增「複製訊息連結」。
            - **聊天輸入列**：與官方相同只保留「+」與表情按鈕，相片、Embed / 進階訊息編輯器、時間戳記與無聲訊息移入「+」面板。
            - **訊息顯示**：提及自己或 @everyone 的訊息以金色底色與左側金條標示；時間戳記支援「昨天 HH:MM」。
            - **私訊列表**：右側顯示最後訊息的相對時間（剛剛 / 分 / 小時 / 天）。

            ### 下載檔案說明
            - **Android (推薦現代手機)**: `DiscordBotClient-arm64-v8a.apk`（體積最小、純 64 位元原生機器碼）
            - **Android (通用版 / 模擬器)**: `DiscordBotClient-universal.apk`
            - **iOS (iPhone / iPad)**: `DiscordBotClient-ios.ipa`（支援 AltStore、SideStore、Sideloadly、TrollStore、Feather、ESign 側載安裝，已啟用 120Hz ProMotion）
          files: release-assets/*
          draft: false
          prerelease: false
