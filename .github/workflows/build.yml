name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1. Build Android Release APK (ARM64 + Universal)
  # ==========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Permissions
        run: |
          flutter create --platforms=android --org io.botclient.mobile --project-name discord_bot_client .
          rm -f test/widget_test.dart
          python3 - << 'EOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          text = text.replace('android:label="discord_bot_client"', 'android:label="DiscordBotClient"')
          manifest.write_text(text, encoding="utf-8")
          EOF

      - name: Bundle Twemoji 15.1 (CC-BY 4.0) as app assets
        run: |
          mkdir -p assets/twemoji
          curl -sSL https://github.com/jdecked/twemoji/archive/refs/tags/v15.1.0.tar.gz \
            | tar xz twemoji-15.1.0/assets/72x72
          cp twemoji-15.1.0/assets/72x72/*.png assets/twemoji/
          rm -rf twemoji-15.1.0
          ls assets/twemoji | wc -l

      - name: Install Dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build Android Split-ABI APK (Ultra-light ARM64)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/DiscordBotClient-arm64-v8a.apk

      - name: Build Android Universal APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk dist/DiscordBotClient-universal.apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-Android-APK
          path: dist/*.apk

  # ==========================================================
  # 2. Build iOS Release IPA (120Hz ProMotion, Sideload Ready)
  # ==========================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bundle Twemoji 15.1 (CC-BY 4.0) as app assets
        run: |
          mkdir -p assets/twemoji
          curl -sSL https://github.com/jdecked/twemoji/archive/refs/tags/v15.1.0.tar.gz \
            | tar xz twemoji-15.1.0/assets/72x72
          cp twemoji-15.1.0/assets/72x72/*.png assets/twemoji/
          rm -rf twemoji-15.1.0
          ls assets/twemoji | wc -l

      - name: Generate iOS Scaffolding & Configure 120Hz ProMotion + Permissions
        run: |
          flutter create --platforms=ios --org io.botclient.mobile --project-name discord_bot_client .
          rm -f test/widget_test.dart
          flutter pub get
          python3 - << 'EOF'
          import plistlib
          from pathlib import Path

          plist_path = Path("ios/Runner/Info.plist")
          with plist_path.open("rb") as f:
              pl = plistlib.load(f)

          pl["CFBundleDisplayName"] = "DiscordBotClient"
          pl["CFBundleName"] = "DiscordBotClient"
          pl["CADisableMinimumFrameDurationOnPhone"] = True
          pl["NSPhotoLibraryUsageDescription"] = "允許選擇相簿圖片作為機器人訊息附件上傳至 Discord 頻道。"
          pl["NSCameraUsageDescription"] = "允許拍攝照片作為機器人訊息附件上傳。"

          with plist_path.open("wb") as f:
              plistlib.dump(pl, f)
          EOF

      - name: Build Unsigned iOS Release App via Xcode
        run: |
          flutter build ios --config-only --release --no-codesign --obfuscate --split-debug-info=build/symbols
          if [ -d "ios/Runner.xcworkspace" ]; then
            XCODE_TARGET=(-workspace ios/Runner.xcworkspace)
          else
            XCODE_TARGET=(-project ios/Runner.xcodeproj)
          fi
          xcodebuild build \
            "${XCODE_TARGET[@]}" \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package & Ad-Hoc Sign Sideloadable IPA
        run: |
          mkdir -p dist
          APP_PATH="build/ios_derived/Build/Products/Release-iphoneos/Runner.app"
          ls -la "$APP_PATH"
          rm -rf build/ipa_stage
          mkdir -p build/ipa_stage/Payload
          cp -R "$APP_PATH" build/ipa_stage/Payload/Runner.app
          codesign --force --deep --sign - build/ipa_stage/Payload/Runner.app || true
          cd build/ipa_stage
          zip -qry ../../dist/DiscordBotClient-ios.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBotClient-iOS-IPA
          path: dist/DiscordBotClient-ios.ipa

  # ==========================================================
  # 3. Publish Combined GitHub Release (APK + IPA)
  # ==========================================================
  publish-release:
    name: Publish APK & IPA Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiscordBotClient-Android-APK
          path: release-assets

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: DiscordBotClient-iOS-IPA
          path: release-assets

      - name: Create / Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.18
          make_latest: true
          name: "DiscordBotClient Mobile v1.10.18 (Android APK & iOS IPA)"
          body: |
            ## ⬇️ 下載
            - **Android（arm64，推薦）**：[DiscordBotClient-arm64-v8a.apk](https://github.com/${{ github.repository }}/releases/download/v1.10.18/DiscordBotClient-arm64-v8a.apk)
            - **Android（通用版）**：[DiscordBotClient-universal.apk](https://github.com/${{ github.repository }}/releases/download/v1.10.18/DiscordBotClient-universal.apk)
            - **iOS**：[DiscordBotClient-ios.ipa](https://github.com/${{ github.repository }}/releases/download/v1.10.18/DiscordBotClient-ios.ipa)

            ### v1.10.18 更新內容
            - **啟動與大型伺服器更流暢**：Gateway 大型封包（READY、GUILD_CREATE 等）改在背景執行緒解析，畫面不再因載入大量伺服器資料而卡頓；封包依序處理，舊連線的殘留封包會被丟棄。
            - **更省記憶體**：壓縮串流緩衝改用位元組緩衝區，大型封包的記憶體用量降為原本約八分之一。
            - **更少寫入**：收到私訊時的私訊列表儲存改為 2 秒合併寫入一次。
            - **程式整理**：移除多餘的 import。

          files: release-assets/*
          draft: false
          prerelease: false
